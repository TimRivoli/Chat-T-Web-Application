<!DOCTYPE html>
<html>
<head> 
    <title>Chatty AI Webserver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="chat-container">
        <div id="buttons-container">
            <div>
				<label for="response-size">Response size:</label>
				<select id="response-size"> <option value="small">Small</option><option selected value="medium">Medium</option><option value="large">Large</option><option value="verylarge">Very Large</option></select>
				<label for="chat-mode">Chat Mode:</label>
				<select id="chat-activity-mode">
					{% for mode in chatActivityModes %}
					<option value='{{ mode }}'> {{ mode }} </option>
					{% endfor %}
				</select>
				<label for="language-option">Language:</label>
				<select id="language-option">
					{% for lang in language_options %}
					<option value="{{ lang }}">{{ lang }}</option>
					{% endfor %}
				</select>
				<label for="temperature">Creativity:</label>
				<select id="temperature">		
					<option value=0> 0 - Uninspired </option>
					<option value=1> 1 - Straight Laced </option>
					<option value=2 selected> 2 - Ordinary </option>
					<option value=3> 3 - Average </option>
					<option value=4> 4 - Imaginative </option>
					<option value=5> 5 - Innovative </option>
					<option value=6> 6 - Resourceful </option>
					<option value=7> 7 - Artistic </option>
					<option value=8> 8 - Inventive </option>
					<option value=9> 9 - Genius </option>
					<option value=10> 10 - Tipsy </option>
				</select>
				<label for="conversation-mode">Conversation mode:</label>
				<input type="checkbox" id="conversation-mode" />
            </div>			
            <div>
				<button class="button" id="clear-button">New</button>
				<button class="button" id="save-as-note-button">Save as Note</button>
				<span style="display:inline-block; width:20px;"></span>
				<button class="button" id="conversations-button">Conversation List</button>
				<button class="button" id="notes-button">Notes</button>
				<button class="button" id="logout-button">Logout</button>
			</div>
        </div>
		<div id="save-note-panel" class="hidden">
			<input type="text" id="save-note-title" placeholder="Note title..." />
			<select id="save-note-category">
				{% for cat in categories %}
				<option value="{{ cat.categoryID }}">{{ cat.categoryName }}</option>
				{% endfor %}
			</select>
			<button class="button" id="confirm-save-note">Save</button>
			<button class="button" id="cancel-save-note" style="background-color:#6c757d;">Cancel</button>
		</div>
		<div id="sync-banner" class="hidden">
			<span id="sync-message"></span>
			<button id="sync-dismiss" onclick="document.getElementById('sync-banner').classList.add('hidden')">&#x2715;</button>
		</div>
		<div id="user-input-container">
			<input type="text" id="user-instructions" placeholder="Custom instructions for model..." />
		</div>
        <div id="chat-box">
		{% for message in messages %}
			{% if message.role == "user" %}
				<div class="user-message">{{ message.content }}</div>
			{% else %}
				<div class="bot-message">{{ message.content|safe }}</div>
			{% endif %}
		{% endfor %}
		</div>
        <div id="user-input-container">
            <input type="text" id="user-input" placeholder="Begin your conversation here..." />
            <button id="send-button" class="button">Send</button>
        </div>
    </div>
    <script src="{{ url_for('static', filename='conversation.js') }}"></script>
    <script src="{{ url_for('static', filename='sync_status.js') }}"></script>
</body>
</html>
